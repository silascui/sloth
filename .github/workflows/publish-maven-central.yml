name: Upload to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify local publications
        run: >-
          ./gradlew --no-daemon
          :player:testDebugUnitTest :player-ui:testDebugUnitTest
          :player:publishReleasePublicationToBundleRepository
          :player-ui:publishReleasePublicationToBundleRepository
      - name: Package local distribution
        run: python3 -B tools/package_framework.py
      - name: Save distribution
        uses: actions/upload-artifact@v4
        with:
          name: sloth-maven-distribution
          path: dist/
      - name: Upload signed publications to Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Missing MAVEN_CENTRAL_USERNAME}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Missing MAVEN_CENTRAL_PASSWORD}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Missing SIGNING_IN_MEMORY_KEY}"
          ./gradlew --no-daemon -PcentralPublishing=true \
            :player:publishToMavenCentral :player-ui:publishToMavenCentral
