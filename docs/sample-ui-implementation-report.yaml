design_sources:
  - 用户要求：增加滑动列表自动播放、短视频播放示例
  - 现有 DemoActivity、VideoHostView 和 FeedPlaybackController
implemented_states:
  - 首页选择列表或短视频示例
  - 列表空闲时选择可见视频面积最大的卡片，相同面积优先保持当前项
  - 列表卡片绑定、回收、移出屏幕与重新附着
  - 短视频上下滑动、相邻预热与点击暂停继续
  - 页面前后台切换与退出释放
