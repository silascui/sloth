assumptions:
  - 使用原生控件与现有本地视频，无需联网
  - 列表停止滚动后选播，滚动开始时当前视频继续播放直到目标切换或宿主移出屏幕
  - 默认静音，列表示例关闭备用解码预热，短视频示例保留预热
