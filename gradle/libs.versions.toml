[versions]
mavenPublish = "0.35.0"
agp = "8.7.3"
kotlin = "2.1.0"
compileSdk = "35"
minSdk = "24"
targetSdk = "35"
media3 = "1.9.0"
appcompat = "1.7.0"
viewpager2 = "1.1.0"
recyclerview = "1.3.1"
lifecycle = "2.8.0"
savedstate = "1.2.1"
core = "1.13.0"
junit = "4.13.2"
annotation = "1.9.1"
testRunner = "1.6.2"
testExt = "1.2.1"
testCore = "1.6.1"
[libraries]
core = { module = "androidx.core:core", version.ref = "core" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
savedstate = { module = "androidx.savedstate:savedstate", version.ref = "savedstate" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
junit = { module = "junit:junit", version.ref = "junit" }
test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
test-ext = { module = "androidx.test.ext:junit", version.ref = "testExt" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
[plugins]
maven-publish-base = { id = "com.vanniktech.maven.publish.base", version.ref = "mavenPublish" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
